<!-- templates/wallet.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ request.user.username }}'s Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        h2 {
            color: #28a745;
            font-weight: bold;
            text-align: center;
        }
        h3 {
            color: #333;
            border-bottom: 2px solid #28a745;
            padding-bottom: 5px;
        }
        form {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        .message {
            color: #d9534f;
            margin: 10px 0;
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #28a745;
            color: white;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            text-align: center;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
        .icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-wallet icon"></i>Your Wallet</h1>
        <h2><i class="fas fa-money-bill-wave icon"></i>Current Balance: KES {{ wallet.balance }}</h2>

        <!-- Deposit Form -->
        <h3><i class="fas fa-plus-circle icon"></i>Deposit Money</h3>
        <form method="POST">
            {% csrf_token %}
            <label for="amount">Amount (KES): </label>
            <input type="number" name="amount" step="0.01" required>
            <button type="submit" name="deposit"><i class="fas fa-arrow-up icon"></i>Deposit</button>
        </form>

        <!-- Withdraw Form -->
        <h3><i class="fas fa-minus-circle icon"></i>Withdraw Money</h3>
        <form method="POST">
            {% csrf_token %}
            <label for="amount">Amount (KES): </label>
            <input type="number" name="amount" step="0.01" required>
            <button type="submit" name="withdraw"><i class="fas fa-arrow-down icon"></i>Withdraw</button>
        </form>

        <!-- Display messages -->
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li {% if message.tags %} class="{{ message.tags }}" {% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        
        <div class="footer">
            <p>&copy; {{ year }} Uchumi-z. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
