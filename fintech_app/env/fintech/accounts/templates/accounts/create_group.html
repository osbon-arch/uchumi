
{% extends 'accounts/base.html' %}
{%block content%}

<div class="group-container" style="color: white;">
    <h2 class="text-center">Create Savings Group</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="group_name">Group Name:</label>
            <input type="text" class="form-control" name="group_name" required>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea class="form-control" name="description" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="savings_goal">Savings Goal (KSh):</label>
            <input type="number" class="form-control" name="savings_goal" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Group</button>
    </form>
    {% if messages %}
        <div class="alert alert-success mt-3">
            {{ messages }}
        </div>
    {% endif %}
    <div class="text-center mt-3">
        <a href="{% url 'group_list' %}">View Your Groups</a>
    </div>
</div>
{% endblock%}
